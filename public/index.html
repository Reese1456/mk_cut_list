<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MKitchens Cutlist Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="masthead">
  <div class="brand">
    <h1>Cutlist Manager</h1>
    <span class="tag">MKitchens</span>
  </div>
  <dl class="totals">
    <div><dt>Cabinets</dt><dd id="t-cabinets">0</dd></div>
    <div><dt>Part lines</dt><dd id="t-lines">0</dd></div>
    <div><dt>Panels</dt><dd id="t-panels">0</dd></div>
    <div><dt>Board</dt><dd id="t-area">0.00 m²</dd></div>
    <div><dt>Edging</dt><dd id="t-edging">0.0 m</dd></div>
  </dl>
</header>

<div class="layout">

  <!-- ---------------------------------------------------------------- -->
  <!-- Input                                                             -->
  <!-- ---------------------------------------------------------------- -->
  <div class="pane-input">

    <section class="sec">
      <div class="sec-head"><h2>Job</h2></div>
      <div class="panel panel-pad">
        <div class="grid grid-2">
          <div class="field">
            <label for="j-client">Client</label>
            <input type="text" id="j-client" placeholder="Name">
          </div>
          <div class="field">
            <label for="j-ref">Reference</label>
            <input type="text" id="j-ref" placeholder="Job number">
          </div>
          <div class="field">
            <label for="j-board">Board colour</label>
            <input type="text" id="j-board" placeholder="White">
          </div>
          <div class="field">
            <label for="j-edge">Edge colour</label>
            <input type="text" id="j-edge" placeholder="White">
          </div>
        </div>
        <div class="check" style="margin-top:12px">
          <input type="checkbox" id="j-gola">
          <label for="j-gola">Gola kitchen &mdash; floor doors lose 35&nbsp;mm</label>
        </div>
      </div>
    </section>

    <section class="sec">
      <details class="settings">
        <summary>Job dimensions</summary>
        <div class="panel panel-pad">
          <div id="globals" class="grid grid-2"></div>
          <button type="button" class="link" id="reset-globals" style="margin-top:12px">
            Reset to standard
          </button>
        </div>
      </details>
    </section>

    <section class="sec">
      <div class="sec-head">
        <h2>Add a cabinet</h2>
      </div>
      <div class="panel panel-pad">
        <div class="grid grid-2">
          <div class="field">
            <label for="a-family">Type</label>
            <select id="a-family"></select>
          </div>
          <div class="field">
            <label for="a-config">Shape</label>
            <select id="a-config"></select>
          </div>
        </div>
        <div class="grid grid-2" style="margin-top:10px">
          <div class="field">
            <label for="a-width">Width</label>
            <input type="number" id="a-width" min="50" max="3000" step="1">
          </div>
          <div class="field">
            <label for="a-qty">Quantity</label>
            <input type="number" id="a-qty" min="1" max="99" step="1" value="1">
          </div>
        </div>
        <div class="widths" id="a-widths"></div>
        <button type="button" class="primary" id="a-add" style="width:100%;margin-top:12px">
          Add cabinet
        </button>
      </div>
    </section>

    <section class="sec">
      <div class="sec-head">
        <h2>Kitchen</h2>
        <span class="count" id="cab-count">nothing added yet</span>
        <span class="spacer"></span>
        <button type="button" class="ghost danger" id="clear-all">Clear all</button>
      </div>
      <div class="cab-list" id="cab-list"></div>
    </section>

  </div>

  <!-- ---------------------------------------------------------------- -->
  <!-- Output                                                            -->
  <!-- ---------------------------------------------------------------- -->
  <div class="pane-output">

    <div id="alerts"></div>

    <section class="sec">
      <div class="sec-head">
        <h2>Cutting list</h2>
        <span class="count" id="parts-count"></span>
        <span class="spacer"></span>
        <div class="seg" id="view-toggle">
          <button type="button" data-view="consolidated" class="on">Consolidated</button>
          <button type="button" data-view="by-cabinet">By cabinet</button>
        </div>
      </div>
      <div id="parts"></div>
    </section>

  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
